<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="330" rx="18" fill="#0f1430"/>
  <!-- left panel -->
  <rect x="24" y="24" width="440" height="282" rx="14" fill="#171d40"/>
  <text x="48" y="64" font-size="22" font-weight="700" fill="#ffffff">What a cheat menu shows</text>
  <text x="48" y="92" font-size="16" fill="#9aa3d1">Several impostors. Which ones are real? No idea.</text>
  <g font-size="17" fill="#ffffff">
    <g transform="translate(60,120)"><circle r="14" cx="14" cy="14" fill="#e53e3e"/><text x="40" y="20">Player A</text><text x="300" y="20" fill="#fc8181" font-weight="700">IMPOSTOR</text></g>
    <g transform="translate(60,158)"><circle r="14" cx="14" cy="14" fill="#38a169"/><text x="40" y="20">Player B</text><text x="300" y="20" fill="#fc8181" font-weight="700">IMPOSTOR</text></g>
    <g transform="translate(60,196)"><circle r="14" cx="14" cy="14" fill="#3182ce"/><text x="40" y="20">Player C</text><text x="300" y="20" fill="#fc8181" font-weight="700">IMPOSTOR</text></g>
    <g transform="translate(60,234)"><circle r="14" cx="14" cy="14" fill="#d69e2e"/><text x="40" y="20">Player D</text><text x="300" y="20" fill="#9ae6b4">Crewmate</text></g>
  </g>
  <!-- arrow -->
  <path d="M478 165 H500" stroke="#4fd1c5" stroke-width="4"/>
  <path d="M496 155 L510 165 L496 175 Z" fill="#4fd1c5"/>
  <!-- right panel -->
  <rect x="520" y="24" width="416" height="282" rx="14" fill="#171d40"/>
  <text x="544" y="64" font-size="22" font-weight="700" fill="#ffffff">What honest players see</text>
  <text x="544" y="92" font-size="16" fill="#9aa3d1">The normal game. Nothing changes for you.</text>
  <g transform="translate(600,120)">
    <path d="M80 0 L150 26 V92 C150 140 118 172 80 192 C42 172 10 140 10 92 V26 Z" fill="#2b6cb0"/>
    <path d="M48 98 L72 122 L114 78" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
